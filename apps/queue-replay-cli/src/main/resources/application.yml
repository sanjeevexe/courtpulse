spring:
  application:
    name: courtpulse-queue-replay
  main:
    banner-mode: "off"
    web-application-type: none
  datasource:
    url: ${COURTPULSE_DB_URL:jdbc:postgresql://localhost:5432/courtpulse}
    username: ${COURTPULSE_DB_USERNAME:courtpulse}
    password: ${COURTPULSE_DB_PASSWORD:}
  flyway:
    enabled: true

courtpulse:
  sqs:
    endpoint: ${COURTPULSE_SQS_ENDPOINT:http://localhost:4566}
    region: ${AWS_REGION:us-east-1}
    local-access-key: ${COURTPULSE_LOCAL_AWS_ACCESS_KEY:test}
    local-secret-key: ${COURTPULSE_LOCAL_AWS_SECRET_KEY:test}
    game-events-queue: ${COURTPULSE_GAME_EVENTS_QUEUE:game-events.fifo}
    game-events-dlq: ${COURTPULSE_GAME_EVENTS_DLQ:game-events-dlq.fifo}
    alert-deliveries-queue: ${COURTPULSE_ALERT_DELIVERIES_QUEUE:alert-deliveries.fifo}
    alert-deliveries-dlq: ${COURTPULSE_ALERT_DELIVERIES_DLQ:alert-deliveries-dlq.fifo}
  mailpit:
    host: ${COURTPULSE_MAILPIT_HOST:localhost}
    port: ${COURTPULSE_MAILPIT_PORT:1025}
  publisher:
    batch-size: ${COURTPULSE_PUBLISHER_BATCH_SIZE:10}
    lease-duration: ${COURTPULSE_PUBLISHER_LEASE_DURATION:30s}
    retry-initial: ${COURTPULSE_PUBLISHER_RETRY_INITIAL:1s}
    retry-maximum: ${COURTPULSE_PUBLISHER_RETRY_MAXIMUM:30s}
    maximum-attempts: ${COURTPULSE_PUBLISHER_MAX_ATTEMPTS:5}
  consumer:
    batch-size: ${COURTPULSE_CONSUMER_BATCH_SIZE:10}
    long-poll-wait: ${COURTPULSE_CONSUMER_LONG_POLL:2s}
    worker-concurrency: ${COURTPULSE_CONSUMER_WORKERS:1}
  demo:
    drain-timeout: ${COURTPULSE_DRAIN_TIMEOUT:60s}
  canary:
    timeout: ${COURTPULSE_CANARY_TIMEOUT:120s}
  provider:
    # none | balldontlie. Play-by-play requires BALLDONTLIE's paid GOAT tier (see ADR 0013).
    name: ${COURTPULSE_PROVIDER:none}
    base-url: ${COURTPULSE_PROVIDER_BASE_URL:https://api.balldontlie.io}
    api-key: ${COURTPULSE_BALLDONTLIE_API_KEY:}
    requests-per-minute: ${COURTPULSE_PROVIDER_REQUESTS_PER_MINUTE:30}
    request-timeout: ${COURTPULSE_PROVIDER_TIMEOUT:5s}
    team-ids: ${COURTPULSE_INGEST_TEAM_IDS:}
  ingest:
    poll-interval: ${COURTPULSE_INGEST_POLL_INTERVAL:15s}
    maximum-live-games: ${COURTPULSE_INGEST_MAX_LIVE_GAMES:15}
    player-lookups-per-cycle: ${COURTPULSE_INGEST_PLAYER_LOOKUPS:5}
    league-zone: ${COURTPULSE_PROVIDER_LEAGUE_ZONE:America/New_York}
    # Providers correct box scores after games end; completed games are re-polled for a while.
    final-refetch-window: ${COURTPULSE_INGEST_FINAL_REFETCH_WINDOW:6h}
    final-refetch-interval: ${COURTPULSE_INGEST_FINAL_REFETCH_INTERVAL:10m}

logging:
  level:
    root: WARN

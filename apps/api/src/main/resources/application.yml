spring:
  application:
    name: courtpulse-api
  datasource:
    url: ${COURTPULSE_DB_URL:jdbc:postgresql://localhost:5432/courtpulse}
    username: ${COURTPULSE_DB_USERNAME:courtpulse}
    password: ${COURTPULSE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${COURTPULSE_API_DB_POOL_SIZE:10}
      connection-timeout: 3000
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${COURTPULSE_API_PORT:8080}
  shutdown: graceful
  # "framework" trusts X-Forwarded-* from the load balancer in deployed environments only.
  forward-headers-strategy: ${COURTPULSE_FORWARD_HEADERS_STRATEGY:none}

courtpulse:
  auth:
    enabled: ${COURTPULSE_AUTH_ENABLED:false}
    issuer-uri: ${COURTPULSE_AUTH_ISSUER_URI:}
    jwk-set-uri: ${COURTPULSE_AUTH_JWK_SET_URI:}
    audience: ${COURTPULSE_AUTH_AUDIENCE:}
    client-id: ${COURTPULSE_AUTH_CLIENT_ID:courtpulse-web}
    browser-scope: ${COURTPULSE_AUTH_BROWSER_SCOPE:openid profile}
    authorities-claim: ${COURTPULSE_AUTH_AUTHORITIES_CLAIM:scope}
    authority-prefix: ${COURTPULSE_AUTH_AUTHORITY_PREFIX:SCOPE_}
    operations-authority: ${COURTPULSE_AUTH_OPERATIONS_AUTHORITY:SCOPE_courtpulse:ops}
    # Cognito access tokens identify the app client in client_id (no aud) and set token_use.
    audience-claim: ${COURTPULSE_AUTH_AUDIENCE_CLAIM:aud}
    required-token-use: ${COURTPULSE_AUTH_REQUIRED_TOKEN_USE:}
    end-session-endpoint: ${COURTPULSE_AUTH_END_SESSION_ENDPOINT:}
  api:
    live-freshness-window: ${COURTPULSE_LIVE_FRESHNESS_WINDOW:2m}
  telemetry:
    scrape-password: ${COURTPULSE_METRICS_SCRAPE_PASSWORD:}
  realtime:
    publication:
      enabled: ${COURTPULSE_REALTIME_PUBLICATION_ENABLED:true}
    publish-delay: ${COURTPULSE_REALTIME_PUBLISH_DELAY:250ms}
    # Below common proxy idle timeouts (nginx 75s here, AWS ALB 60s by default).
    keepalive-interval: ${COURTPULSE_REALTIME_KEEPALIVE_INTERVAL:25s}
    # Public site origins allowed to open /ws/v1/games when the API sits behind a CDN.
    allowed-origins: ${COURTPULSE_REALTIME_ALLOWED_ORIGINS:}
    lease-duration: ${COURTPULSE_REALTIME_LEASE_DURATION:15s}
    batch-size: ${COURTPULSE_REALTIME_BATCH_SIZE:25}
    maximum-attempts: ${COURTPULSE_REALTIME_MAXIMUM_ATTEMPTS:5}
    session-limit: ${COURTPULSE_REALTIME_SESSION_LIMIT:500}
    outbound-buffer-size: ${COURTPULSE_REALTIME_OUTBOUND_BUFFER_SIZE:32}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,courtPulseSchema
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.courtpulse: INFO

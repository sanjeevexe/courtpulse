name: Acceptance

# The isolated end-to-end harnesses: minutes each, so weekly and on demand rather than per commit.
# scripts/run-performance-tests.sh stays manual: shared runners would make its numbers misleading.
on:
  schedule:
    - cron: '41 7 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harness:
    name: ${{ matrix.script }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        script:
          - verify-milestone-6.sh
          - verify-milestone-7.sh
          - verify-milestone-8.sh
          - verify-milestone-9.sh
          - verify-milestone-10.sh
          - verify-observability.sh
          - verify-milestone-12.sh
          - verify-release-rehearsal.sh
          - verify-recovery.sh
          - verify-replay.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release rehearsal builds the previous release for its rollback step
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Browser tooling for harnesses with a browser step
        working-directory: apps/web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run ${{ matrix.script }}
        run: scripts/${{ matrix.script }}
      - name: Keep harness evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.script }}
          path: build/verification/
          retention-days: 14

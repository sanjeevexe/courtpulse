name: Security

# Static analysis, secret scanning, dependency review, and a dynamic OWASP ZAP baseline. CodeQL
# and dependency review are free for public repositories; on a private repository they need GitHub
# Code Security, so those jobs run only when the repository is public.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '21'
      - uses: github/codeql-action/init@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # codeql-bundle-v2.27.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Compile for analysis
        if: matrix.language == 'java-kotlin'
        run: ./gradlew compileJava compileTestJava --no-build-cache --no-configuration-cache --console=plain
      - uses: github/codeql-action/analyze@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # codeql-bundle-v2.27.1
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: >
          docker run --rm -v "${PWD}:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  filesystem:
    name: Dependency and IaC vulnerability scan (Trivy filesystem)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: 'apps/web/node_modules,**/.terraform,build'
          trivyignores: .trivyignore

  zap-baseline:
    name: OWASP ZAP baseline against the Compose stack
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COURTPULSE_DB_PASSWORD: ci-only-local-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Start the stack with the seeded game
        run: |
          docker compose up -d --wait postgres localstack
          ./gradlew :apps:queue-replay-cli:run --args='--reset-import --run' --console=plain
          docker compose up -d --build --wait api web
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:4173
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline
      - name: Stop the stack
        if: always()
        run: docker compose down -v

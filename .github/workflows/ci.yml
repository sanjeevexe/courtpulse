name: CI

# Every pull request and every push to main. deploy-staging.yml runs after this workflow succeeds
# on main (and skips itself until AWS variables exist), so this is the release gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests (JUnit, Testcontainers, LocalStack)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Run every test suite against real PostgreSQL and LocalStack containers
        run: ./gradlew test --console=plain
      - name: Fail if any container-backed test was skipped
        run: scripts/ci/assert-tests-ran.sh
      - name: Keep test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  frontend:
    name: Frontend contract, types, lint, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check:api
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - name: Production dependency audit (high and critical)
        run: npm audit --omit=dev --audit-level=high

  browser:
    name: Browser acceptance against the Compose stack
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COURTPULSE_DB_PASSWORD: ci-only-local-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Start PostgreSQL and LocalStack
        run: docker compose up -d --wait postgres localstack
      - name: Seed the synthetic game through the real outbox and FIFO queue
        run: ./gradlew :apps:queue-replay-cli:run --args='--reset-import --run' --console=plain
      - name: Build and start the API and web containers
        run: docker compose up -d --build --wait api web
      - name: Install Chromium
        working-directory: apps/web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Dashboard acceptance (desktop and mobile)
        working-directory: apps/web
        run: npx playwright test e2e/dashboard.spec.ts
      - name: Keep Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  images:
    name: Container image ${{ matrix.image }} (build, non-root, Trivy)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
          - image: worker
            dockerfile: apps/queue-replay-cli/Dockerfile
          - image: web
            dockerfile: apps/web/Dockerfile
          - image: provider-simulator
            dockerfile: apps/provider-simulator/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: courtpulse-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Image must not run as root
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' "courtpulse-${{ matrix.image }}:ci")"
          echo "image user: ${user}"
          [[ -n "${user}" && "${user}" != root && "${user}" != 0 ]]
      - name: Trivy vulnerability scan (fixable high and critical fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: courtpulse-${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

  infrastructure:
    name: Terraform fmt, validate, mocked plan tests, TFLint, Trivy config
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate every root without a backend or AWS credentials
        run: |
          for root in infra/terraform/bootstrap infra/terraform/environments/staging; do
            terraform -chdir="${root}" init -backend=false -input=false
            terraform -chdir="${root}" validate
          done
      - name: Plan tests against mock providers
        run: terraform -chdir=infra/terraform/environments/staging test
      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
      - name: TFLint with the AWS ruleset
        working-directory: infra/terraform
        env:
          # Plugin downloads use the GitHub API; authenticated requests avoid the shared-runner
          # anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config="${PWD}/.tflint.hcl"
          tflint --recursive --config="${PWD}/.tflint.hcl"
      - name: Trivy misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: '**/.terraform'

  static:
    name: Shell, workflow, alert-rule, and Compose checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck every script
        run: shellcheck -x scripts/*.sh scripts/aws/*.sh scripts/ci/*.sh apps/web/docker-entrypoint.d/*.sh localstack/init/ready.d/*.sh
      - name: actionlint
        run: docker run --rm -v "${PWD}:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Prometheus alert rules
        run: docker run --rm -v "${PWD}/ops/observability:/o" --entrypoint promtool prom/prometheus:v3.6.0 check rules /o/alerts.yaml
      - name: Compose files resolve for every profile
        env:
          COURTPULSE_DB_PASSWORD: compose-config-only
          COURTPULSE_METRICS_SCRAPE_PASSWORD: compose-config-only
          COURTPULSE_GRAFANA_ADMIN_PASSWORD: compose-config-only
          COURTPULSE_METRICS_SCRAPE_PASSWORD_FILE: /dev/null
        run: |
          docker compose --profile auth --profile delivery --profile reconciliation --profile live --profile simulator config --quiet
          docker compose -f compose.yaml -f compose.observability.yaml --profile delivery --profile reconciliation \
            --profile observability --profile live --profile simulator config --quiet

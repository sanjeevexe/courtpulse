# Weekly, grouped update pull requests. CI must pass before any merge; security updates open
# immediately regardless of this schedule. Major versions (a new Java or PostgreSQL release, Gradle
# 9, JUnit 6, TypeScript 7) need deliberate migrations, so they are upgraded by hand, not proposed
# here: the project stays on Java 21 (LTS) and PostgreSQL 17.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Jackson 3 stays on the minor line Spring Boot is built against (3.1.x for Boot 4.1);
      # patch releases still arrive. Revisit when Spring Boot moves.
      - dependency-name: 'tools.jackson*'
        update-types: ['version-update:semver-minor']

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/queue-replay-cli
      - /apps/web
      - /apps/provider-simulator
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: terraform
    directories:
      - /infra/terraform/bootstrap
      - /infra/terraform/environments/staging
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

openapi: 3.1.0
info:
  title: CourtPulse Read API
  version: 1.2.0
  description: Public durable basketball reads plus OIDC-protected ownership, structured rules, and private alerts.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/games:
    get:
      summary: List durable games
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [SCHEDULED, LIVE, FINAL]}}
        - {name: limit, in: query, required: false, schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: Stable keyset page
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GamePage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/games/{gameId}:
    get:
      summary: Read current durable game snapshot
      parameters:
        - {$ref: '#/components/parameters/GameId'}
        - {name: If-None-Match, in: header, required: false, schema: {type: string}}
      responses:
        '200':
          description: Current snapshot
          headers:
            ETag: {description: Snapshot validator, schema: {type: string}}
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GameSnapshot'}
              example:
                gameId: game_synthetic_001
                status: FINAL
                homeScore: 18
                awayScore: 14
                playerPoints: {player_ace: 13}
                stateVersion: 20
                stateChecksum: 06d40d7e19ecf9ed9496e1523e6715bba029f008f94cb76148f600702d4c3bca
                dataStatus: FINAL
        '304':
          description: Snapshot has not changed
          headers:
            ETag: {description: Snapshot validator, schema: {type: string}}
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/games/{gameId}/events:
    get:
      summary: Read canonical event history
      parameters:
        - {$ref: '#/components/parameters/GameId'}
        - {name: limit, in: query, required: false, schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
        - {name: afterSequence, in: query, required: false, schema: {type: integer, format: int64, minimum: 0}}
      responses:
        '200':
          description: Events ordered by sequence, revision, and event ID
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/EventPage'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/games/{gameId}/alerts:
    get:
      summary: Read durable logical alerts
      parameters:
        - {$ref: '#/components/parameters/GameId'}
        - {name: limit, in: query, required: false, schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: Alerts in stable reverse chronological order
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AlertPage'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/operations/processing:
    get:
      summary: Read sanitized processing health
      security: [{oidcBearer: ['courtpulse:ops']}]
      responses:
        '200':
          description: Sanitized outbox and processing counts
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Processing'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/operations/rules:
    get:
      summary: Read sanitized aggregate rule-engine health
      security: [{oidcBearer: ['courtpulse:ops']}]
      responses:
        '200':
          description: Sanitized aggregate rule counts
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/RuleOperations'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/operations/deliveries:
    get:
      summary: Read sanitized aggregate alert-delivery health
      security: [{oidcBearer: ['courtpulse:ops']}]
      responses:
        '200':
          description: Aggregate delivery counts and pending age
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryOperations'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/operations/reconciliations:
    get:
      summary: Read aggregate correction and reconciliation health
      security: [{oidcBearer: ['courtpulse:ops']}]
      responses:
        '200':
          description: Aggregate reconciliation counts
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/ReconciliationOperations'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/operations/providers:
    get:
      summary: Read aggregate live-provider client and freshness health
      security: [{oidcBearer: ['courtpulse:ops']}]
      responses:
        '200':
          description: Provider circuit, quota, freshness, and incident counts
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/ProviderOperations'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/me:
    get:
      summary: Read the authenticated application user
      security: [{oidcBearer: []}]
      responses:
        '200':
          description: Stable identity derived exclusively from the validated JWT subject
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/config:
    get:
      summary: Read non-secret public browser OIDC configuration
      responses:
        '200':
          description: Public OIDC client settings
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthenticationConfiguration'}}}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/me/followed-games:
    get:
      summary: List games followed by the authenticated user
      security: [{oidcBearer: []}]
      responses:
        '200':
          description: Followed games owned by the validated JWT subject
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/FollowedGamePage'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/me/followed-games/{gameId}:
    put:
      summary: Follow a public game idempotently
      security: [{oidcBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/GameId'}
      responses:
        '200':
          description: Existing follow retained
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/FollowedGame'}}}
        '201':
          description: Follow created
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
            Location: {description: Owned follow resource, schema: {type: string}}
          content: {application/json: {schema: {$ref: '#/components/schemas/FollowedGame'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      summary: Stop following a game; an absent follow returns 204
      security: [{oidcBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/GameId'}
      responses:
        '204':
          description: Follow absent after the request
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/me/rules:
    get:
      summary: List alert rules owned by the authenticated user
      security: [{oidcBearer: []}]
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, format: int32, minimum: 1, maximum: 100}}
        - {name: cursor, in: query, required: false, schema: {type: string, maxLength: 2048}}
      responses:
        '200':
          description: Stable owner-scoped rule page
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/RulePage'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      summary: Create a structured alert rule idempotently
      security: [{oidcBearer: []}]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 100, pattern: '^[A-Za-z0-9._:-]+$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAlertRule'}
      responses:
        '200':
          description: Identical idempotent request retained
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
            Location: {description: Owned alert rule, schema: {type: string}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AlertRule'}}}
        '201':
          description: Alert rule created
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
            Location: {description: Owned alert rule, schema: {type: string}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AlertRule'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/me/rules/{ruleId}:
    get:
      summary: Read one owned alert rule
      security: [{oidcBearer: []}]
      parameters: [{$ref: '#/components/parameters/RuleId'}]
      responses:
        '200':
          description: Owned alert rule
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AlertRule'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/RuleNotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
    patch:
      summary: Enable or disable an owned alert rule with optimistic concurrency
      security: [{oidcBearer: []}]
      parameters: [{$ref: '#/components/parameters/RuleId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateAlertRule'}}}
      responses:
        '200':
          description: Updated alert rule
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AlertRule'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/RuleNotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      summary: Delete an owned alert rule
      security: [{oidcBearer: []}]
      parameters: [{$ref: '#/components/parameters/RuleId'}]
      responses:
        '204':
          description: Alert rule deleted
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/RuleNotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/me/alerts:
    get:
      summary: List private alerts owned by the authenticated user
      security: [{oidcBearer: []}]
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, format: int32, minimum: 1, maximum: 100}}
        - {name: cursor, in: query, required: false, schema: {type: string, maxLength: 2048}}
      responses:
        '200':
          description: Stable owner-scoped alert page
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/OwnedAlertPage'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/me/notifications/settings:
    get:
      summary: Read private notification settings
      security: [{oidcBearer: []}]
      responses:
        '200':
          description: Owned notification settings
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/NotificationSettings'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      summary: Update local email opt-in and destination
      security: [{oidcBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateNotificationSettings'}}}
      responses:
        '200':
          description: Updated owned settings
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/NotificationSettings'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/me/notifications/deliveries:
    get:
      summary: Read owned delivery history
      security: [{oidcBearer: []}]
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, format: int32, minimum: 1, maximum: 100}}
        - {name: cursor, in: query, required: false, schema: {type: string, maxLength: 2048}}
      responses:
        '200':
          description: Owned delivery history
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryHistoryPage'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/me/notifications/deliveries/{deliveryId}/attempts:
    get:
      summary: Read immutable attempts for one owned delivery
      security: [{oidcBearer: []}]
      parameters:
        - {name: deliveryId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: limit, in: query, required: false, schema: {type: integer, format: int32, minimum: 1, maximum: 100}}
        - {name: cursor, in: query, required: false, schema: {type: string, maxLength: 2048}}
      responses:
        '200':
          description: Owned delivery attempts
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryAttemptPage'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    oidcBearer:
      type: oauth2
      description: OIDC Authorization Code with PKCE for public browser clients
      flows:
        authorizationCode:
          authorizationUrl: https://identity.example/authorize
          tokenUrl: https://identity.example/token
          scopes:
            openid: Authenticate the user
            'courtpulse:ops': Read operational processing state
  headers:
    CorrelationId: {description: Safe request correlation identifier, schema: {type: string}}
  parameters:
    GameId: {name: gameId, in: path, required: true, schema: {type: string, maxLength: 200}}
    RuleId: {name: ruleId, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Unauthorized:
      description: Missing, expired, or invalid bearer token
      headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Forbidden:
      description: Authenticated identity lacks the required authority
      headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    BadRequest:
      description: Invalid parameter or cursor
      headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    NotFound:
      description: Unknown game
      headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    RuleNotFound:
      description: Alert rule not found or not owned by the authenticated user
      headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Conflict:
      description: Idempotency key or optimistic version conflict
      headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Unprocessable:
      description: Structurally valid rule cannot be accepted
      headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    TooManyRequests:
      description: Per-user alert-rule quota exceeded
      headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    MethodNotAllowed:
      description: HTTP method is not supported
      headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    NotAcceptable:
      description: Requested representation is unavailable
      headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    InternalError:
      description: Unexpected server failure
      headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Unavailable:
      description: Durable data unavailable
      headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
  schemas:
    NotificationSettings:
      type: object
      required: [inAppEnabled, emailEnabled]
      properties:
        inAppEnabled: {type: boolean}
        emailEnabled: {type: boolean}
        emailAddress: {type: [string, 'null']}
    UpdateNotificationSettings:
      type: object
      additionalProperties: false
      required: [emailEnabled]
      properties:
        emailEnabled: {type: boolean}
        emailAddress: {type: [string, 'null'], maxLength: 254}
    DeliveryHistoryPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/DeliveryHistoryRecord'}}
        nextCursor: {type: [string, 'null']}
    DeliveryHistoryRecord:
      type: object
      required: [id, alertId, channel, status, attempts, createdAt]
      properties:
        id: {type: string, format: uuid}
        alertId: {type: string, format: uuid}
        channel: {type: string, enum: [IN_APP, EMAIL]}
        status: {type: string, enum: [DELIVERED, PENDING, LEASED, RETRY_SCHEDULED, FAILED, CANCELLED]}
        attempts: {type: integer, format: int32}
        createdAt: {type: string, format: date-time}
        deliveredAt: {type: [string, 'null'], format: date-time}
        nextAttemptAt: {type: [string, 'null'], format: date-time}
        lastErrorCode: {type: [string, 'null']}
    DeliveryAttemptPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/DeliveryAttemptRecord'}}
        nextCursor: {type: [string, 'null']}
    DeliveryAttemptRecord:
      type: object
      required: [id, attemptNumber, outcome, completedAt]
      properties:
        id: {type: string, format: uuid}
        attemptNumber: {type: integer, format: int32}
        outcome: {type: string, enum: [SENT, TRANSIENT_FAILURE, PERMANENT_FAILURE, CANCELLED, UNKNOWN_ACCEPTANCE]}
        errorCode: {type: [string, 'null']}
        completedAt: {type: string, format: date-time}
    AuthenticationConfiguration:
      type: object
      additionalProperties: false
      required: [enabled, issuer, clientId, scope]
      properties:
        enabled: {type: boolean}
        issuer: {type: string}
        clientId: {type: string, minLength: 1}
        scope: {type: string, minLength: 1}
        endSessionEndpoint:
          type: [string, 'null']
          description: Logout endpoint when the provider's discovery document omits one (Cognito)
    Me:
      type: object
      additionalProperties: false
      required: [subject]
      properties:
        subject: {type: string, minLength: 1, maxLength: 255}
    FollowedGamePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/FollowedGame'}}
    FollowedGame:
      type: object
      additionalProperties: false
      required: [gameId, followedAt]
      properties:
        gameId: {type: string, minLength: 1, maxLength: 200}
        followedAt: {type: string, format: date-time}
    GamePage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/GameSummary'}}
        nextCursor: {type: [string, 'null']}
    GameSummary:
      type: object
      required: [gameId, source, homeTeamId, awayTeamId, status, stateVersion, homeScore, awayScore, period, clockMillisRemaining, lastAppliedSequence, updatedAt, dataStatus]
      properties:
        gameId: {type: string}
        source: {type: string}
        homeTeamId: {type: string}
        awayTeamId: {type: string}
        status: {type: string, enum: [SCHEDULED, LIVE, FINAL]}
        stateVersion: {type: integer, format: int64}
        homeScore: {type: integer, format: int32}
        awayScore: {type: integer, format: int32}
        period: {type: integer, format: int32}
        clockMillisRemaining: {type: integer, format: int64}
        lastAppliedSequence: {type: integer, format: int64}
        updatedAt: {type: string, format: date-time}
        stateChecksum: {type: [string, 'null']}
        dataStatus: {$ref: '#/components/schemas/DataStatus'}
        homeTeamName: {type: [string, 'null'], maxLength: 120}
        homeTeamAbbreviation: {type: [string, 'null'], maxLength: 8}
        awayTeamName: {type: [string, 'null'], maxLength: 120}
        awayTeamAbbreviation: {type: [string, 'null'], maxLength: 8}
        scheduledAt: {type: [string, 'null'], format: date-time}
    GameSnapshot:
      type: object
      required: [gameId, source, homeTeamId, awayTeamId, status, period, clockMillisRemaining, homeScore, awayScore, playerPoints, stateVersion, lastAppliedSequence, recentEvents, updatedAt, dataStatus, playerNames]
      properties:
        gameId: {type: string}
        source: {type: string}
        homeTeamId: {type: string}
        awayTeamId: {type: string}
        status: {type: string, enum: [SCHEDULED, LIVE, FINAL]}
        period: {type: integer, format: int32}
        clockMillisRemaining: {type: integer, format: int64}
        homeScore: {type: integer, format: int32}
        awayScore: {type: integer, format: int32}
        playerPoints: {type: object, additionalProperties: {type: integer, format: int32}}
        stateVersion: {type: integer, format: int64}
        lastAppliedSequence: {type: integer, format: int64}
        stateChecksum: {type: [string, 'null']}
        recentEvents: {type: array, items: {$ref: '#/components/schemas/RecentEvent'}}
        updatedAt: {type: string, format: date-time}
        dataStatus: {$ref: '#/components/schemas/DataStatus'}
        homeTeamName: {type: [string, 'null'], maxLength: 120}
        homeTeamAbbreviation: {type: [string, 'null'], maxLength: 8}
        awayTeamName: {type: [string, 'null'], maxLength: 120}
        awayTeamAbbreviation: {type: [string, 'null'], maxLength: 8}
        scheduledAt: {type: [string, 'null'], format: date-time}
        playerNames: {type: object, additionalProperties: {type: string}}
    RecentEvent:
      type: object
      required: [eventId, sequence, revision, eventType, occurredAt, scoreAfter]
      properties:
        eventId: {type: string}
        sequence: {type: integer, format: int64}
        revision: {type: integer, format: int32}
        eventType: {type: string}
        occurredAt: {type: string, format: date-time}
        scoreAfter: {$ref: '#/components/schemas/Score'}
        description: {type: [string, 'null'], maxLength: 280}
    EventPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Event'}}
        nextCursor: {type: [string, 'null']}
    Event:
      type: object
      required: [eventId, schemaVersion, gameId, source, providerEventId, sequence, revision, eventType, period, clockMillisRemaining, occurredAt, participantIds, scoreAfter, points]
      properties:
        eventId: {type: string}
        schemaVersion: {type: integer, format: int32}
        gameId: {type: string}
        source: {type: string}
        providerEventId: {type: string}
        sequence: {type: integer, format: int64}
        revision: {type: integer, format: int32}
        eventType: {type: string}
        period: {type: integer, format: int32}
        clockMillisRemaining: {type: integer, format: int64}
        occurredAt: {type: string, format: date-time}
        teamId: {type: [string, 'null']}
        participantIds: {type: array, items: {type: string}}
        scoreAfter: {$ref: '#/components/schemas/Score'}
        points: {type: integer, format: int32}
        description: {type: [string, 'null'], maxLength: 280}
    Score:
      type: object
      required: [home, away]
      properties: {home: {type: integer, format: int32}, away: {type: integer, format: int32}}
    AlertPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Alert'}}
        nextCursor: {type: [string, 'null']}
    Alert:
      type: object
      required: [ruleId, triggerKey, gameId, triggeringEventId, title, context, status, createdAt]
      properties:
        ruleId: {type: string}
        triggerKey: {type: string}
        gameId: {type: string}
        triggeringEventId: {type: string}
        title: {type: string}
        context: {type: object, additionalProperties: {type: string}}
        status: {type: string}
        createdAt: {type: string, format: date-time}
    RuleType: {type: string, enum: [PLAYER_POINTS, CLOSE_GAME, SCORING_RUN]}
    CreateAlertRule:
      oneOf:
        - {$ref: '#/components/schemas/CreatePlayerPointsRule'}
        - {$ref: '#/components/schemas/CreateCloseGameRule'}
        - {$ref: '#/components/schemas/CreateScoringRunRule'}
      discriminator:
        propertyName: type
        mapping:
          PLAYER_POINTS: '#/components/schemas/CreatePlayerPointsRule'
          CLOSE_GAME: '#/components/schemas/CreateCloseGameRule'
          SCORING_RUN: '#/components/schemas/CreateScoringRunRule'
    CreatePlayerPointsRule:
      type: object
      additionalProperties: false
      required: [type, gameId, playerId, pointsThreshold]
      properties:
        type: {type: string, enum: [PLAYER_POINTS]}
        gameId: {type: string, minLength: 1, maxLength: 200}
        playerId: {type: string, minLength: 1, maxLength: 200}
        pointsThreshold: {type: integer, format: int32, minimum: 1, maximum: 200}
        enabled: {type: boolean, default: true}
    CreateCloseGameRule:
      type: object
      additionalProperties: false
      required: [type, gameId, maximumMargin, eligiblePeriod, maximumClockMillisRemaining]
      properties:
        type: {type: string, enum: [CLOSE_GAME]}
        gameId: {type: string, minLength: 1, maxLength: 200}
        maximumMargin: {type: integer, format: int32, minimum: 1, maximum: 20}
        eligiblePeriod: {type: integer, format: int32, minimum: 1, maximum: 10}
        maximumClockMillisRemaining: {type: integer, format: int64, minimum: 0, maximum: 720000}
        enabled: {type: boolean, default: true}
    CreateScoringRunRule:
      type: object
      additionalProperties: false
      required: [type, gameId, teamId, pointsThreshold]
      properties:
        type: {type: string, enum: [SCORING_RUN]}
        gameId: {type: string, minLength: 1, maxLength: 200}
        teamId: {type: string, minLength: 1, maxLength: 200}
        pointsThreshold: {type: integer, format: int32, minimum: 1, maximum: 100}
        enabled: {type: boolean, default: true}
    UpdateAlertRule:
      type: object
      additionalProperties: false
      required: [enabled, version]
      properties:
        enabled: {type: boolean}
        version: {type: integer, format: int64, minimum: 1}
    AlertRule:
      oneOf:
        - {$ref: '#/components/schemas/PlayerPointsRule'}
        - {$ref: '#/components/schemas/CloseGameRule'}
        - {$ref: '#/components/schemas/ScoringRunRule'}
      discriminator:
        propertyName: type
        mapping:
          PLAYER_POINTS: '#/components/schemas/PlayerPointsRule'
          CLOSE_GAME: '#/components/schemas/CloseGameRule'
          SCORING_RUN: '#/components/schemas/ScoringRunRule'
    PlayerPointsRule:
      type: object
      additionalProperties: false
      required: [id, type, gameId, enabled, playerId, pointsThreshold, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [PLAYER_POINTS]}
        gameId: {type: string}
        enabled: {type: boolean}
        playerId: {type: string}
        pointsThreshold: {type: integer, format: int32}
        version: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CloseGameRule:
      type: object
      additionalProperties: false
      required: [id, type, gameId, enabled, maximumMargin, eligiblePeriod, maximumClockMillisRemaining, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [CLOSE_GAME]}
        gameId: {type: string}
        enabled: {type: boolean}
        maximumMargin: {type: integer, format: int32}
        eligiblePeriod: {type: integer, format: int32}
        maximumClockMillisRemaining: {type: integer, format: int64}
        version: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ScoringRunRule:
      type: object
      additionalProperties: false
      required: [id, type, gameId, enabled, teamId, pointsThreshold, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [SCORING_RUN]}
        gameId: {type: string}
        enabled: {type: boolean}
        teamId: {type: string}
        pointsThreshold: {type: integer, format: int32}
        version: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    RulePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AlertRule'}}
        nextCursor: {type: [string, 'null']}
    OwnedAlertPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/OwnedAlert'}}
        nextCursor: {type: [string, 'null']}
    OwnedAlert:
      type: object
      additionalProperties: false
      required: [id, ruleId, ruleType, gameId, triggeringEventId, title, context, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        ruleId: {type: string}
        ruleType: {$ref: '#/components/schemas/RuleType'}
        gameId: {type: string}
        triggeringEventId: {type: string}
        title: {type: string}
        context: {type: object, additionalProperties: {type: string}}
        status: {type: string}
        createdAt: {type: string, format: date-time}
    RuleOperations:
      type: object
      additionalProperties: false
      required: [ownedRules, enabledOwnedRules, disabledOwnedRules, systemRules, privateAlerts]
      properties:
        ownedRules: {type: integer, format: int64}
        enabledOwnedRules: {type: integer, format: int64}
        disabledOwnedRules: {type: integer, format: int64}
        systemRules: {type: integer, format: int64}
        privateAlerts: {type: integer, format: int64}
    DeliveryOperations:
      type: object
      additionalProperties: false
      required: [backlog, oldestPendingAgeSeconds, publications, attempts, successes, retries, terminalFailures, leaseRecoveries, dlqDepth, dlqObservedAt]
      properties:
        backlog: {type: integer, format: int64}
        oldestPendingAgeSeconds: {type: number, format: double}
        publications: {type: integer, format: int64}
        attempts: {type: integer, format: int64}
        successes: {type: integer, format: int64}
        retries: {type: integer, format: int64}
        terminalFailures: {type: integer, format: int64}
        leaseRecoveries: {type: integer, format: int64}
        dlqDepth: {type: integer, format: int64}
        dlqObservedAt: {type: [string, 'null'], format: date-time}
    ProviderOperations:
      type: object
      required: [providers]
      properties:
        providers: {type: array, items: {$ref: '#/components/schemas/ProviderSource'}}
    ProviderSource:
      type: object
      required: [source, circuitState, requestsTotal, rateLimitedTotal, failuresTotal, consecutiveFailures, scheduledGames, liveGames, finalGames, dataIncidents]
      properties:
        source: {type: string}
        circuitState: {type: string, enum: [CLOSED, OPEN, HALF_OPEN]}
        requestsTotal: {type: integer, format: int64}
        rateLimitedTotal: {type: integer, format: int64}
        failuresTotal: {type: integer, format: int64}
        consecutiveFailures: {type: integer, format: int32}
        lastErrorCode: {type: [string, 'null']}
        lastSuccessAgeSeconds: {type: [integer, 'null'], format: int64}
        scheduledGames: {type: integer, format: int64}
        liveGames: {type: integer, format: int64}
        finalGames: {type: integer, format: int64}
        stalestLiveFeedAgeSeconds: {type: [integer, 'null'], format: int64}
        dataIncidents: {type: integer, format: int64}
    ReconciliationOperations:
      type: object
      additionalProperties: false
      required: [pending, rebuilding, blocked, completed, unchanged, failedAttempts, oldestPendingAgeSeconds]
      properties:
        pending: {type: integer, format: int64}
        rebuilding: {type: integer, format: int64}
        blocked: {type: integer, format: int64}
        completed: {type: integer, format: int64}
        unchanged: {type: integer, format: int64}
        failedAttempts: {type: integer, format: int64}
        oldestPendingAgeSeconds: {type: [integer, 'null'], format: int64}
    Processing:
      type: object
      required: [pending, publishing, retryScheduled, sent, failed, deferredNotifications, blockedGames, processedEvents, alerts, apiTimestamp]
      properties:
        pending: {type: integer, format: int64}
        publishing: {type: integer, format: int64}
        retryScheduled: {type: integer, format: int64}
        sent: {type: integer, format: int64}
        failed: {type: integer, format: int64}
        deferredNotifications: {type: integer, format: int64}
        oldestEligiblePendingAgeSeconds: {type: [integer, 'null'], format: int64}
        blockedGames: {type: integer, format: int64}
        processedEvents: {type: integer, format: int64}
        alerts: {type: integer, format: int64}
        apiTimestamp: {type: string, format: date-time}
    DataStatus: {type: string, enum: [SCHEDULED, LIVE, FINAL, STALE, PROCESSING_BLOCKED]}
    Problem:
      type: object
      required: [type, title, status, detail, instance, correlationId, code]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer, format: int32}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        correlationId: {type: string}
        code: {type: string}

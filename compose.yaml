services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: courtpulse
      POSTGRES_USER: courtpulse
      POSTGRES_PASSWORD: ${COURTPULSE_DB_PASSWORD:?Set COURTPULSE_DB_PASSWORD before starting PostgreSQL}
    ports:
      - "${COURTPULSE_POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtpulse -d courtpulse"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - courtpulse-postgres-data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:4.4.0
    environment:
      SERVICES: sqs,ses
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PERSISTENCE: "1"
    ports:
      - "${COURTPULSE_LOCALSTACK_HOST_PORT:-4566}:4566"
    healthcheck:
      # Healthy once the ready.d hook has created the queues, not merely when SQS answers.
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - courtpulse-localstack-data:/var/lib/localstack
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      COURTPULSE_DB_URL: jdbc:postgresql://postgres:5432/courtpulse
      COURTPULSE_DB_USERNAME: courtpulse
      COURTPULSE_DB_PASSWORD: ${COURTPULSE_DB_PASSWORD:?Set COURTPULSE_DB_PASSWORD before starting the API}
      COURTPULSE_API_PORT: 8080
      COURTPULSE_AUTH_ENABLED: ${COURTPULSE_AUTH_ENABLED:-false}
      COURTPULSE_AUTH_ISSUER_URI: ${COURTPULSE_AUTH_ISSUER_URI:-}
      COURTPULSE_AUTH_JWK_SET_URI: ${COURTPULSE_AUTH_JWK_SET_URI:-}
      COURTPULSE_AUTH_AUDIENCE: ${COURTPULSE_AUTH_AUDIENCE:-}
      COURTPULSE_AUTH_CLIENT_ID: ${COURTPULSE_AUTH_CLIENT_ID:-courtpulse-web}
      COURTPULSE_AUTH_BROWSER_SCOPE: ${COURTPULSE_AUTH_BROWSER_SCOPE:-openid profile}
      COURTPULSE_AUTH_AUTHORITIES_CLAIM: ${COURTPULSE_AUTH_AUTHORITIES_CLAIM:-scope}
      COURTPULSE_AUTH_AUTHORITY_PREFIX: ${COURTPULSE_AUTH_AUTHORITY_PREFIX:-SCOPE_}
      COURTPULSE_AUTH_OPERATIONS_AUTHORITY: ${COURTPULSE_AUTH_OPERATIONS_AUTHORITY:-SCOPE_courtpulse:ops}
      COURTPULSE_LIVE_FRESHNESS_WINDOW: ${COURTPULSE_LIVE_FRESHNESS_WINDOW:-2m}
      COURTPULSE_REALTIME_ALLOWED_ORIGINS: ${COURTPULSE_REALTIME_ALLOWED_ORIGINS:-}
      COURTPULSE_REALTIME_SESSION_LIMIT: ${COURTPULSE_REALTIME_SESSION_LIMIT:-500}
      COURTPULSE_RATE_LIMIT_ENABLED: ${COURTPULSE_RATE_LIMIT_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${COURTPULSE_API_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      COURTPULSE_AUTH_ISSUER_ORIGIN: ${COURTPULSE_AUTH_ISSUER_ORIGIN:-}
    ports:
      - "${COURTPULSE_WEB_HOST_PORT:-4173}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  identity:
    image: quay.io/keycloak/keycloak:26.7.0
    profiles: ["auth"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${COURTPULSE_IDP_ADMIN_USERNAME:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${COURTPULSE_IDP_ADMIN_PASSWORD:-}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${COURTPULSE_AUTH_ISSUER_BASE:-http://127.0.0.1:8180}
      KC_HTTP_PORT: 8080
    ports:
      - "${COURTPULSE_IDP_HOST_PORT:-8180}:8080"
    volumes:
      # Users live in Keycloak's embedded database; keeping it in a volume keeps each user's
      # subject (and so their rules, alerts, and settings) stable across restarts. The realm
      # file is imported only when the realm does not exist yet.
      - courtpulse-identity-data:/opt/keycloak/data
      - ./identity/keycloak/courtpulse-realm.json:/opt/keycloak/data/import/courtpulse-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 24

  mailpit:
    image: axllent/mailpit:v1.27.9
    profiles: ["delivery"]
    ports:
      - "${COURTPULSE_MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "${COURTPULSE_MAILPIT_UI_HOST_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8025/api/v1/info"]
      interval: 5s
      timeout: 3s
      retries: 12

  delivery-worker:
    profiles: ["delivery"]
    restart: on-failure
    build:
      context: .
      dockerfile: apps/queue-replay-cli/Dockerfile
    environment:
      COURTPULSE_DB_URL: jdbc:postgresql://postgres:5432/courtpulse
      COURTPULSE_DB_USERNAME: courtpulse
      COURTPULSE_DB_PASSWORD: ${COURTPULSE_DB_PASSWORD:?Set COURTPULSE_DB_PASSWORD}
      COURTPULSE_SQS_ENDPOINT: http://localstack:4566
      COURTPULSE_MAILPIT_HOST: mailpit
      COURTPULSE_MAILPIT_PORT: 1025
      # mailpit by default; "ses" with COURTPULSE_SES_ENDPOINT=http://localstack:4566 rehearses AWS.
      COURTPULSE_EMAIL_PROVIDER: ${COURTPULSE_EMAIL_PROVIDER:-mailpit}
      COURTPULSE_EMAIL_FROM: ${COURTPULSE_EMAIL_FROM:-alerts@courtpulse.test}
      COURTPULSE_SES_ENDPOINT: ${COURTPULSE_SES_ENDPOINT:-}
      COURTPULSE_PUBLIC_BASE_URL: ${COURTPULSE_PUBLIC_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/courtpulse-delivery-worker.heartbeat -mmin -1 | grep -q heartbeat"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6

  reconciliation-worker:
    profiles: ["reconciliation"]
    restart: on-failure
    build:
      context: .
      dockerfile: apps/queue-replay-cli/Dockerfile
    command: ["--reconciliation-daemon"]
    environment:
      COURTPULSE_DB_URL: jdbc:postgresql://postgres:5432/courtpulse
      COURTPULSE_DB_USERNAME: courtpulse
      COURTPULSE_DB_PASSWORD: ${COURTPULSE_DB_PASSWORD:?Set COURTPULSE_DB_PASSWORD}
      COURTPULSE_SQS_ENDPOINT: http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/courtpulse-reconciliation-worker.heartbeat -mmin -1 | grep -q heartbeat"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6

  # Local-only BALLDONTLIE-shaped test double serving one fictional overtime game.
  provider-simulator:
    profiles: ["simulator"]
    build:
      context: .
      dockerfile: apps/provider-simulator/Dockerfile
    environment:
      SIMULATOR_API_KEY: ${COURTPULSE_SIMULATOR_API_KEY:-local-simulator-key}
      SIMULATOR_MODE: ${COURTPULSE_SIMULATOR_MODE:-clock}
      SIMULATOR_SPEED: ${COURTPULSE_SIMULATOR_SPEED:-60}
      SIMULATOR_START_DELAY_SECONDS: ${COURTPULSE_SIMULATOR_START_DELAY_SECONDS:-20}
      SIMULATOR_CORRECT_AFTER_ORDER: ${COURTPULSE_SIMULATOR_CORRECT_AFTER_ORDER:-120}
    ports:
      - "127.0.0.1:${COURTPULSE_SIMULATOR_HOST_PORT:-18090}:8080"

  # Continuous outbox publisher and FIFO consumer (the deployed form of --run).
  processor-worker:
    profiles: ["live"]
    restart: on-failure
    build:
      context: .
      dockerfile: apps/queue-replay-cli/Dockerfile
    command: ["--processor-daemon"]
    environment:
      COURTPULSE_DB_URL: jdbc:postgresql://postgres:5432/courtpulse
      COURTPULSE_DB_USERNAME: courtpulse
      COURTPULSE_DB_PASSWORD: ${COURTPULSE_DB_PASSWORD:?Set COURTPULSE_DB_PASSWORD}
      COURTPULSE_SQS_ENDPOINT: http://localstack:4566
      COURTPULSE_CONSUMER_WORKERS: ${COURTPULSE_CONSUMER_WORKERS:-2}
      COURTPULSE_PUBLISHER_BATCH_SIZE: ${COURTPULSE_PUBLISHER_BATCH_SIZE:-50}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/courtpulse-processor-worker.heartbeat -mmin -1 | grep -q heartbeat"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6

  # Live provider polling. Defaults target the local simulator; set COURTPULSE_PROVIDER_BASE_URL
  # to https://api.balldontlie.io and a real COURTPULSE_BALLDONTLIE_API_KEY to use the paid API.
  ingestor-worker:
    profiles: ["live"]
    restart: on-failure
    build:
      context: .
      dockerfile: apps/queue-replay-cli/Dockerfile
    command: ["--ingest-daemon"]
    environment:
      COURTPULSE_DB_URL: jdbc:postgresql://postgres:5432/courtpulse
      COURTPULSE_DB_USERNAME: courtpulse
      COURTPULSE_DB_PASSWORD: ${COURTPULSE_DB_PASSWORD:?Set COURTPULSE_DB_PASSWORD}
      COURTPULSE_SQS_ENDPOINT: http://localstack:4566
      COURTPULSE_PROVIDER: balldontlie
      COURTPULSE_PROVIDER_BASE_URL: ${COURTPULSE_PROVIDER_BASE_URL:-http://provider-simulator:8080}
      COURTPULSE_BALLDONTLIE_API_KEY: ${COURTPULSE_BALLDONTLIE_API_KEY:-local-simulator-key}
      COURTPULSE_PROVIDER_REQUESTS_PER_MINUTE: ${COURTPULSE_PROVIDER_REQUESTS_PER_MINUTE:-120}
      COURTPULSE_INGEST_POLL_INTERVAL: ${COURTPULSE_INGEST_POLL_INTERVAL:-5s}
      COURTPULSE_INGEST_TEAM_IDS: ${COURTPULSE_INGEST_TEAM_IDS:-}
      COURTPULSE_INGEST_FINAL_REFETCH_INTERVAL: ${COURTPULSE_INGEST_FINAL_REFETCH_INTERVAL:-10m}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      provider-simulator:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/courtpulse-ingestor-worker.heartbeat -mmin -1 | grep -q heartbeat"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6

  # Replays of real completed games (imported with --replay-import) served as live games.
  replay-worker:
    profiles: ["replay"]
    restart: on-failure
    build:
      context: .
      dockerfile: apps/queue-replay-cli/Dockerfile
    command: ["--ingest-daemon"]
    environment:
      COURTPULSE_DB_URL: jdbc:postgresql://postgres:5432/courtpulse
      COURTPULSE_DB_USERNAME: courtpulse
      COURTPULSE_DB_PASSWORD: ${COURTPULSE_DB_PASSWORD:?Set COURTPULSE_DB_PASSWORD}
      COURTPULSE_SQS_ENDPOINT: http://localstack:4566
      COURTPULSE_PROVIDER: nba-replay
      COURTPULSE_INGEST_POLL_INTERVAL: ${COURTPULSE_REPLAY_POLL_INTERVAL:-2s}
      COURTPULSE_INGEST_MAX_LIVE_GAMES: "10"
      COURTPULSE_INGEST_PLAYER_LOOKUPS: "40"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/courtpulse-ingestor-worker.heartbeat -mmin -1 | grep -q heartbeat"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6

volumes:
  courtpulse-identity-data:
  courtpulse-postgres-data:
  courtpulse-localstack-data:

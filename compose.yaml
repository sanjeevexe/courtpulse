services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: courtpulse
      POSTGRES_USER: courtpulse
      POSTGRES_PASSWORD: ${COURTPULSE_DB_PASSWORD:?Set COURTPULSE_DB_PASSWORD before starting PostgreSQL}
    ports:
      - "${COURTPULSE_POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtpulse -d courtpulse"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - courtpulse-postgres-data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:4.4.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PERSISTENCE: "1"
    ports:
      - "${COURTPULSE_LOCALSTACK_HOST_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"running\"'"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - courtpulse-localstack-data:/var/lib/localstack
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      COURTPULSE_DB_URL: jdbc:postgresql://postgres:5432/courtpulse
      COURTPULSE_DB_USERNAME: courtpulse
      COURTPULSE_DB_PASSWORD: ${COURTPULSE_DB_PASSWORD:?Set COURTPULSE_DB_PASSWORD before starting the API}
      COURTPULSE_API_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${COURTPULSE_API_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${COURTPULSE_WEB_HOST_PORT:-4173}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

volumes:
  courtpulse-postgres-data:
  courtpulse-localstack-data:

global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: courtpulse-api
    metrics_path: /internal/metrics
    scheme: http
    basic_auth:
      username: courtpulse
      password_file: /etc/prometheus/scrape-password
    static_configs:
      - targets: [api:8080]
